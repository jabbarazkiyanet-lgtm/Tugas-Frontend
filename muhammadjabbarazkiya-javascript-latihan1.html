
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 - Form Registrasi</title>

    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            padding: 40px 7%;
        }

        h1 {
            font-size: 48px;
        }

        input {
            display: block;
            padding: 10px;
            margin: 10px 0 20px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Latihan 1</h1>

    <form id="formRegistrasi">

        <label for="namaDepan">Nama Depan</label>
        <input type="text" id="namaDepan" required>

        <label for="namaBelakang">Nama Belakang</label>
        <input type="text" id="namaBelakang" required>

        <button type="submit">Submit</button>

    </form>

    <script>
        const form = document.getElementById("formRegistrasi");

        form.addEventListener("submit", function(event) {
            event.preventDefault();

            const namaDepan = document.getElementById("namaDepan").value;
            const namaBelakang = document.getElementById("namaBelakang").value;

            console.log("Nama Lengkap : " + namaDepan + " " + namaBelakang);
        });
    </script>

</body>
</html>
